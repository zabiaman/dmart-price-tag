<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د قیمت ټګ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

.tag {
    width: 100%;
    max-width: 450px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 25px rgba(0,0,0,0.2);
}

/* سر بینر */
.tag-header {
    background: #d9534f;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo {
    background: white; color: #d9534f; width: 45px; height: 45px;
    border-radius: 50%; display: flex; justify-content: center;
    align-items: center; font-weight: bold; font-size: 22px;
}
.brand-text { display: flex; flex-direction: column; }
.brand-text span { font-size: 14px; font-weight: bold; }
.brand-text small { font-size: 10px; opacity: 0.9; }
.promo { text-align: left; }
.promo h2 { font-size: 24px; margin: 0; font-weight: bold; }
.promo p { font-size: 11px; margin: 0; text-align: center; }

/* بدنه */
.tag-body { padding: 20px; display: flex; gap: 20px; }
.price-section { flex: 1; }
.price-label { color: #4a7c59; font-weight: bold; margin-bottom: 10px; font-size: 15px; }
.price-value {
    background: #7bbf6a; color: white; padding: 15px;
    border-radius: 10px; display: flex; justify-content: center;
    align-items: baseline; gap: 5px;
}
.price-value .num { font-size: 48px; font-weight: bold; line-height: 1; }
.price-value .cur { font-size: 22px; }
.info-section { flex: 1.2; text-align: right; }
.product-name { color: #b03a3a; font-size: 20px; font-weight: bold; line-height: 1.4; }
.product-weight { color: #b03a3a; font-size: 15px; margin-top: 5px; }

/* فوټر */
.tag-footer {
    padding: 0 20px 15px;
    display: flex; justify-content: space-between; align-items: flex-end;
}
.dates { font-size: 10px; color: #d9534f; line-height: 1.5; }
.barcode { text-align: center; }
.barcode-lines {
    width: 150px; height: 40px;
    background: repeating-linear-gradient(90deg,
        #000 0px, #000 2px, #fff 2px, #fff 4px,
        #000 4px, #000 5px, #fff 5px, #fff 8px,
        #000 8px, #000 11px, #fff 11px, #fff 12px,
        #000 12px, #000 14px, #fff 14px, #fff 16px,
        #000 16px, #000 18px);
}
.barcode-num { font-size: 11px; font-family: monospace; letter-spacing: 2px; margin-top: 3px; }

/* تڼۍ */
.buttons {
    display: flex; gap: 10px;
    padding: 15px 20px;
    background: #f8f9fa;
    border-top: 1px solid #eee;
}
.buttons button, .buttons a {
    flex: 1; padding: 14px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: bold; cursor: pointer;
    text-decoration: none; text-align: center;
}
.btn-print { background: #d9534f; color: white; }
.btn-back { background: #95a5a6; color: white; }

/* د چاپ وخت */
/* د چاپ وخت */
@media print {
    @page {
        size: A5;
        margin: 3mm;
    }
    body { background: white; padding: 0; margin: 0; }
    .buttons { display: none; }
    .tag { box-shadow: none; max-width: 100%; border-radius: 8px; }
}
</style>
</head>
<body>

<div class="tag" id="tag">
    <div class="tag-header">
        <div class="brand">
            <div class="brand-logo">D!</div>
            <div class="brand-text">
                <span>دي مارټ</span>
                <small>Dmart</small>
            </div>
        </div>
        <div class="promo">
            <h2>عرض خاص</h2>
            <p>promotion</p>
        </div>
    </div>

    <div class="tag-body">
        <div class="price-section">
            <div class="price-label">الحبة بسعر</div>
            <div class="price-value">
                <span class="num" id="priceNum">0</span>
                <span class="cur" id="priceCur">ر.س</span>
            </div>
        </div>
        <div class="info-section">
            <div class="product-name" id="productName"></div>
            <div class="product-weight" id="productWeight"></div>
        </div>
    </div>

    <div class="tag-footer">
        <div class="dates">
            <div id="startDate"></div>
            <div id="endDate"></div>
        </div>
        <div class="barcode">
            <div class="barcode-lines"></div>
            <div class="barcode-num" id="barcodeNum"></div>
        </div>
    </div>

    <div class="buttons">
        <button class="btn-print" onclick="window.print()">🖨️ چاپ کړه</button>
        <a href="index.html" class="btn-back">← بیرته</a>
    </div>
</div>

<script>
// د URL څخه د محصول ID یا بارکوډ اخیستل
var params = new URLSearchParams(window.location.search);
var id = params.get('id');
var barcode = params.get('barcode');

// د محصولاتو لیست
var products = [
    { id: 1, name: 'مهران معجون الزنجبيل', weight: '320 جرام', price: 5.95, currency: 'ر.س', barcode: '633152014535', startDate: '15/6/2026', endDate: '30/6/2026' },
    { id: 2, name: 'زيت الزيتون', weight: '1 لتر', price: 25.50, currency: 'ر.س', barcode: '633152014536', startDate: '15/6/2026', endDate: '30/6/2026' },
    { id: 3, name: 'عسل طبيعي', weight: '500 جرام', price: 45.00, currency: 'ر.س', barcode: '633152014537', startDate: '15/6/2026', endDate: '30/6/2026' },
    { id: 4, name: 'تمر مجدول', weight: '1 کیلو', price: 35.00, currency: 'ر.س', barcode: '633152014538', startDate: '15/6/2026', endDate: '30/6/2026' }
];

// د محصول موندل
var product = null;
if (id) {
    product = products.find(function(p) { return p.id == id; });
} else if (barcode) {
    product = products.find(function(p) { return p.barcode == barcode; });
}

// که محصول ونه موندل شو، لومړی محصول وښایه
if (!product) product = products[0];

// معلومات ښودل
document.getElementById('priceNum').textContent = product.price;
document.getElementById('priceCur').textContent = product.currency;
document.getElementById('productName').textContent = product.name;
document.getElementById('productWeight').textContent = product.weight;
document.getElementById('barcodeNum').textContent = product.barcode;
document.getElementById('startDate').textContent = 'يبدأ من ' + product.startDate;
document.getElementById('endDate').textContent = 'حتى ' + product.endDate;
</script>

</body>
</html>
