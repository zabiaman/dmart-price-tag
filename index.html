<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9534f">
<title>سوپر مارکیټ - د قیمت ټګ</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
body { background: #f0f2f5; padding-bottom: 80px; }
.app-header { background: linear-gradient(135deg, #d9534f, #b03a3a); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .logo { background: white; color: #d9534f; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 22px; }
.brand h1 { font-size: 18px; }
.brand small { font-size: 11px; opacity: 0.9; }
.search-bar { padding: 15px 20px; background: white; }
.search-bar input { width: 100%; padding: 14px 20px; border: 2px solid #e0e0e0; border-radius: 30px; font-size: 15px; background: #f8f9fa; }
.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px 20px; background: white; margin-bottom: 15px; }
.action-btn { background: #f8f9fa; border: none; padding: 15px 5px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
.action-btn .icon { font-size: 24px; }
.section-title { padding: 15px 20px 10px; }
.section-title h2 { font-size: 16px; color: #333; }
.product-list { padding: 0 15px; display: flex; flex-direction: column; gap: 12px; }
.product-card { background: white; border-radius: 15px; padding: 15px; display: flex; gap: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.product-img { width: 70px; height: 70px; border-radius: 12px; background: #f0f2f5; display: flex; justify-content: center; align-items: center; font-size: 32px; }
.product-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.product-name { color: #b03a3a; font-size: 15px; font-weight: bold; }
.product-weight { color: #999; font-size: 12px; margin-top: 4px; }
.product-price { background: #7bbf6a; color: white; padding: 6px 14px; border-radius: 20px; font-size: 15px; font-weight: bold; display: inline-block; margin-top: 8px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; box-shadow: 0 -2px 15px rgba(0,0,0,0.08); }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #999; font-size: 11px; flex: 1; max-width: 80px; }
.nav-item .icon { font-size: 22px; }
.nav-item.active { color: #d9534f; }
</style>
</head>
<body>
<header class="app-header">
<div class="brand">
<div class="logo">D!</div>
<div>
<h1>دي مارټ</h1>
<small>Dmart</small>
</div>
</div>
<div style="font-size: 28px;">👤</div>
</header>

<div class="search-bar">
<input type="text" id="searchInput" placeholder="🔍 د محصول نوم یا بارکوډ...">
</div>

<div class="quick-actions">
<button class="action-btn"><<a href="scanner.html" class="action-btn" style="text-decoration:none;color:#333;"><span class="icon">📷</span><span>سکنر</span></a>
<button class="action-btn"><span class="icon">📦</span><span>محصولات</span></button>
<button class="action-btn"><span class="icon">➕</span><span>نوی</span></button>
<button class="action-btn"><span class="icon">📊</span><span>راپور</span></button>
</div>

<div class="section-title"><h2>📋 نوي محصولات</h2></div>
<div id="productList" class="product-list"></div>

<nav class="bottom-nav">
<a href="index.html" class="nav-item active"><span class="icon">🏠</span><span>کور</span></a>
<a href="#" class="nav-item"><span class="icon">📷</span><span>سکنر</span></a>
<a href="#" class="nav-item"><span class="icon">📦</span><span>محصولات</span></a>
<a href="#" class="nav-item"><span class="icon">📊</span><span>راپور</span></a>
<a href="#" class="nav-item"><span class="icon">⚙️</span><span>تنظیمات</span></a>
</nav>

<script>
const products = [
{ name: 'مهران معجون الزنجبيل', weight: '320 جرام', price: 5.95, currency: 'ر.س', icon: '🫙' },
{ name: 'زيت الزيتون', weight: '1 لتر', price: 25.50, currency: 'ر.س', icon: '🫒' },
{ name: 'عسل طبيعي', weight: '500 جرام', price: 45.00, currency: 'ر.س', icon: '🍯' },
{ name: 'تمر مجدول', weight: '1 کیلو', price: 35.00, currency: 'ر.س', icon: '🌴' },
];

function displayProducts(list) {
const container = document.getElementById('productList');
container.innerHTML = '';
list.forEach(p => {
container.innerHTML += `<div class="product-card"><div class="product-img">${p.icon}</div><div class="product-info"><div><div class="product-name">${p.name}</div><div class="product-weight">${p.weight}</div></div><div class="product-price">${p.price} ${p.currency}</div></div></div>`;
});
}

document.getElementById('searchInput').addEventListener('input', (e) => {
const q = e.target.value.toLowerCase();
displayProducts(products.filter(p => p.name.toLowerCase().includes(q)));
});

displayProducts(products);

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
