<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9534f">
<title>سوپر مارکیټ</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
body { background: #f0f2f5; padding-bottom: 80px; }

/* ===== هیدر ===== */
.header { background: #d9534f; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
.header-left { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; cursor: pointer; }
.header-left:active { opacity: 0.8; }
.logo { background: white; color: #d9534f; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 22px; flex-shrink: 0; }
.title { font-size: 18px; font-weight: bold; }
.subtitle { font-size: 11px; opacity: 0.9; }

.user-icon {
    font-size: 28px;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    transition: background 0.2s;
    position: relative;
    text-decoration: none;
    color: white;
}
.user-icon:active { background: rgba(255,255,255,0.2); }

.user-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #d9534f;
}
.user-badge.online { background: #7bbf6a; }
.user-badge.offline { background: #999; }

/* ===== لټون ===== */
.search { padding: 15px 20px; background: white; }
.search input { width: 100%; padding: 14px 20px; border: 2px solid #e0e0e0; border-radius: 30px; font-size: 15px; background: #f8f9fa; }
.search input:focus { outline: none; border-color: #d9534f; background: white; }

/* ===== مالیې او زکات ===== */
.tax-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; background: white; margin-bottom: 15px; }
.tax-card { background: linear-gradient(135deg, #f8f9fa, #e9ecef); border-radius: 12px; padding: 15px; display: flex; align-items: center; gap: 12px; border: 2px solid #dee2e6; }
.tax-icon { font-size: 32px; }
.tax-details { flex: 1; }
.tax-label { font-size: 11px; color: #666; margin-bottom: 4px; }
.tax-value { font-size: 20px; font-weight: bold; color: #d9534f; }

/* ===== مینو ۱۸ تڼۍ ===== */
.menu { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 12px; background: white; margin-bottom: 15px; }
.menu a { background: #f8f9fa; padding: 12px 3px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; text-decoration: none; color: #333; transition: all 0.2s; }
.menu a:active { background: #d9534f; color: white; transform: scale(0.95); }
.menu .icon { font-size: 24px; }

/* ===== برخې سرلیک ===== */
.section-title { padding: 15px 20px 10px; font-size: 16px; color: #333; font-weight: bold; }
.products { padding: 0 15px; display: flex; flex-direction: column; gap: 12px; }
.card { background: white; border-radius: 15px; padding: 15px; display: flex; gap: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.card-img { width: 70px; height: 70px; border-radius: 12px; background: #f0f2f5; display: flex; justify-content: center; align-items: center; font-size: 32px; flex-shrink: 0; }
.card-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.card-name { color: #b03a3a; font-size: 15px; font-weight: bold; }
.card-weight { color: #999; font-size: 12px; margin-top: 4px; }
.card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.card-price { background: #7bbf6a; color: white; padding: 6px 14px; border-radius: 20px; font-size: 15px; font-weight: bold; }
.card-print { background: #d9534f; color: white; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: bold; }

/* ===== ښکته نیویگیشن ===== */
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; box-shadow: 0 -2px 15px rgba(0,0,0,0.08); z-index: 100; }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #999; font-size: 11px; flex: 1; max-width: 80px; }
.nav .icon { font-size: 22px; }
.nav a.active { color: #d9534f; }

.empty { text-align: center; padding: 40px 20px; color: #999; }

/* ===== د کارن مینو (پاپ اپ) ===== */
.user-menu {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.user-menu.active { display: flex; }
.user-menu-content {
    background: white;
    border-radius: 20px;
    padding: 25px;
    max-width: 350px;
    width: 100%;
    text-align: center;
}
.user-menu-icon { font-size: 60px; margin-bottom: 15px; }
.user-menu-content h3 { color: #333; font-size: 18px; margin-bottom: 8px; }
.user-menu-content .user-name { color: #d9534f; font-weight: bold; font-size: 16px; margin-bottom: 5px; }
.user-menu-content .user-status { color: #666; font-size: 13px; margin-bottom: 20px; }
.user-menu-content button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}
.btn-login { background: #7bbf6a; color: white; }
.btn-logout { background: #e74c3c; color: white; }
.btn-cancel { background: #95a5a6; color: white; }

@media (max-width: 400px) {
    .menu { grid-template-columns: repeat(4, 1fr); }
    .menu .icon { font-size: 22px; }
    .menu a { font-size: 9px; padding: 10px 2px; }
}
</style>
</head>
<body>

<div class="logo">D!</div>

<div class="menu">
<a href="scanner.html"><span class="icon">📷</span><span>سکنر</span></a>

</nav>

<!-- ===== د کارن مینو ===== -->
<div class="user-menu" id="userMenu">
<div class="user-menu-content">
<div class="user-menu-icon" id="userMenuIcon">👤</div>
<h3 id="userMenuTitle">کاروونکی</h3>
<div class="user-name" id="userMenuName"></div>
<div class="user-status" id="userMenuStatus"></div>
<div id="userMenuButtons"></div>
</div>
</div>

<script>
var STORAGE_KEY = 'dmart_products';
var SESSION_KEY = 'dmart_session';
var defaultProducts = [
{ id: 1, name: "مهران معجون الزنجبيل", weight: "320 جرام", price: 5.95, currency: "ر.س", icon: "🫙", barcode: "633152014535" },
{ id: 2, name: "زيت الزيتون", weight: "1 لتر", price: 25.50, currency: "ر.س", icon: "🫒", barcode: "633152014536" },
{ id: 3, name: "عسل طبيعي", weight: "500 جرام", price: 45.00, currency: "ر.س", icon: "🍯", barcode: "633152014537" },
{ id: 4, name: "تمر مجدول", weight: "1 کیلو", price: 35.00, currency: "ر.س", icon: "🌴", barcode: "633152014538" },
{ id: 5, name: "مياه معدنية", weight: "1.5 لتر", price: 3.00, currency: "ر.س", icon: "💧", barcode: "633152014539" },
{ id: 6, name: "شاي أخضر", weight: "250 جرام", price: 18.50, currency: "ر.س", icon: "🍵", barcode: "633152014540" }
];

function loadProducts() {
    var data = localStorage.getItem(STORAGE_KEY);
    if (data) { try { return JSON.parse(data); } catch(e) { return defaultProducts; } }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultProducts));
    return defaultProducts;
}

var products = loadProducts();

function displayProducts(list) {
    var container = document.getElementById("productList");
    if (list.length === 0) {
        container.innerHTML = '<div class="empty">هیڅ محصول ونه موندل شو</div>';
        return;
    }
    var html = "";
    for (var i = 0; i < list.length; i++) {
        var p = list[i];
        html += '<div class="card">' +
            '<div class="card-img">' + (p.icon || '📦') + '</div>' +
            '<div class="card-info">' +
            '<div>' +
            '<div class="card-name">' + p.name + '</div>' +
            '<div class="card-weight">' + (p.weight || '') + '</div>' +
            '</div>' +
            '<div class="card-bottom">' +
            '<div class="card-price">' + p.price + ' ' + (p.currency || 'ر.س') + '</div>' +
            '<a href="price-tag.html?barcode=' + p.barcode + '" class="card-print">🖨️ چاپ</a>' +
            '</div>' +
            '</div>' +
            '</div>';
    }
    container.innerHTML = html;
}

function doSearch() {
    var q = document.getElementById("searchInput").value.trim();
    var qLower = q.toLowerCase();
    var filtered = [];
    if (q === "") { filtered = products; }
    else {
        for (var i = 0; i < products.length; i++) {
            var p = products[i];
            var nameMatch = p.name.toLowerCase().indexOf(qLower) !== -1;
            var barcodeMatch = p.barcode ? p.barcode.indexOf(q) !== -1 : false;
            if (nameMatch || barcodeMatch) { filtered.push(p); }
        }
    }
    displayProducts(filtered);
}

document.getElementById("searchInput").addEventListener("input", doSearch);
document.getElementById("searchInput").addEventListener("keyup", doSearch);

window.addEventListener('focus', function() {
    products = loadProducts();
    displayProducts(products);
    updateUserBadge();
});

window.addEventListener('pageshow', function() {
    products = loadProducts();
    displayProducts(products);
    updateUserBadge();
});

// ===== د کارن حالت =====
function getSession() {
    var data = localStorage.getItem(SESSION_KEY);
    if (data) { try { return JSON.parse(data); } catch(e) { return null; } }
    return null;
}

function updateUserBadge() {
    var badge = document.getElementById('userBadge');
    var session = getSession();
    if (session) {
        badge.className = 'user-badge online';
    } else {
        badge.className = 'user-badge offline';
    }
}

// ===== د کارن مینو =====
function openUserMenu(event) {
    event.preventDefault();
    
    var session = getSession();
    var menu = document.getElementById('userMenu');
    var icon = document.getElementById('userMenuIcon');
    var title = document.getElementById('userMenuTitle');
    var nameEl = document.getElementById('userMenuName');
    var statusEl = document.getElementById('userMenuStatus');
    var buttons = document.getElementById('userMenuButtons');
    
    if (session) {
        // کاروونکی لاګین دی
        icon.textContent = '👤';
        title.textContent = 'ښه راغلاست!';
        nameEl.textContent = session.name || session.username || 'کاروونکی';
        statusEl.textContent = 'تاسو د مدیر پینل ته لاګین یاست ✅';
        
        var loginTime = session.loginTime ? new Date(session.loginTime).toLocaleString('ar-EG') : '';
        if (loginTime) {
            statusEl.textContent += '\n\nد ننوتلو وخت: ' + loginTime;
        }
        
        buttons.innerHTML = 
            '<button class="btn-login" onclick="goToAdmin()">👨‍💼 د مدیر پینل</button>' +
            '<button class="btn-logout" onclick="doLogout()">🚪 وتل</button>' +
            '<button class="btn-cancel" onclick="closeUserMenu()">بنده کړه</button>';
    } else {
        // کاروونکی لاګین نه دی
        icon.textContent = '👤';
        title.textContent = 'کاروونکی';
        nameEl.textContent = 'تاسو لاګین نه یاست';
        statusEl.textContent = 'د مدیر پینل لپاره ننوځه';
        
        buttons.innerHTML = 
            '<button class="btn-login" onclick="goToLogin()">🔐 ننوتل</button>' +
            '<button class="btn-cancel" onclick="closeUserMenu()">بنده کړه</button>';
    }
    
    menu.classList.add('active');
}

function closeUserMenu() {
    document.getElementById('userMenu').classList.remove('active');
}

function goToLogin() {
    window.location.href = 'login.html';
}

function goToAdmin() {
    window.location.href = 'admin.html';
}

function doLogout() {
    if (confirm('ایا ډاډه یې چې وتل غواړې؟')) {
        localStorage.removeItem(SESSION_KEY);
        alert('✅ وتل بریالي شو');
        closeUserMenu();
        updateUserBadge();
        window.location.reload();
    }
}

// د مینو بندول کله چې د مینو څخه بهر کلیک شي
document.getElementById('userMenu').addEventListener('click', function(e) {
    if (e.target === this) {
        closeUserMenu();
    }
});

// ===== پیل =====
displayProducts(products);
updateUserBadge();

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
