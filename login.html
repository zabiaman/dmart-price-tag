<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9534f">
<title>د کاروونکي ننوتل</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
body { background: linear-gradient(135deg, #d9534f, #b03a3a); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

.login-box {
    background: white;
    padding: 35px 25px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 380px;
}

.login-logo {
    background: #d9534f;
    color: white;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 32px;
    margin: 0 auto 15px;
    box-shadow: 0 5px 15px rgba(217, 83, 79, 0.4);
}

.login-box h1 {
    color: #d9534f;
    text-align: center;
    font-size: 22px;
    margin-bottom: 8px;
}

.login-box .sub {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    color: #333;
    margin-bottom: 8px;
    font-weight: bold;
    font-size: 14px;
}

.form-group input {
    width: 100%;
    padding: 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    background: #f8f9fa;
    transition: all 0.3s;
}

.form-group input:focus {
    outline: none;
    border-color: #d9534f;
    background: white;
}

.btn-login {
    width: 100%;
    padding: 15px;
    background: #d9534f;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
    transition: all 0.3s;
}

.btn-login:active { transform: scale(0.97); }

.message {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
    font-size: 13px;
    display: none;
}
.message.error { background: #f8d7da; color: #721c24; display: block; }
.message.success { background: #d4edda; color: #155724; display: block; }

.hint {
    text-align: center;
    color: #999;
    font-size: 11px;
    margin-top: 20px;
    padding: 10px;
    background: #f8f9fa;
    border-radius: 8px;
}
</style>
</head>
<body>

<div class="login-box">
    <div class="login-logo">D!</div>
    <h1>د کاروونکي ننوتل</h1>
    <div class="sub">د مدیر پینل ته د ننوتلو لپاره</div>

    <div id="messageBox" class="message"></div>

    <form onsubmit="return doLogin(event)">
        <div class="form-group">
            <label>👤 د کارن نوم</label>
            <input type="text" id="username" placeholder="admin" required autocomplete="username">
        </div>
        <div class="form-group">
            <label>🔒 پاسورډ</label>
            <input type="password" id="password" placeholder="••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">🔐 ننوځه</button>
    </form>

    <div class="hint">
        💡 د لومړي ځل لپاره:<br>
        <strong>admin</strong> / <strong>admin123</strong>
    </div>
</div>

<script>
// ===== د کاروونکو معلومات =====
var USERS_KEY = 'dmart_users';
var SESSION_KEY = 'dmart_session';

// د ډیفالټ کاروونکی
var defaultUsers = [
    { username: 'admin', password: 'admin123', name: 'مدیر', role: 'admin' }
];

// د کاروونکو معلومات لوستل
function loadUsers() {
    var data = localStorage.getItem(USERS_KEY);
    if (data) { try { return JSON.parse(data); } catch(e) { return defaultUsers; } }
    localStorage.setItem(USERS_KEY, JSON.stringify(defaultUsers));
    return defaultUsers;
}

// د ننوتلو فعالیت
function doLogin(e) {
    e.preventDefault();
    
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();
    var messageBox = document.getElementById('messageBox');
    
    if (!username || !password) {
        messageBox.className = 'message error';
        messageBox.textContent = '❌ مهرباني وکړه نوم او پاسورډ ولیکه';
        return false;
    }
    
    var users = loadUsers();
    var foundUser = null;
    
    for (var i = 0; i < users.length; i++) {
        if (users[i].username === username && users[i].password === password) {
            foundUser = users[i];
            break;
        }
    }
    
    if (foundUser) {
        // د سیشن خوندي کول
        localStorage.setItem(SESSION_KEY, JSON.stringify({
            username: foundUser.username,
            name: foundUser.name,
            role: foundUser.role,
            loginTime: new Date().toISOString()
        }));
        
        messageBox.className = 'message success';
        messageBox.textContent = '✅ ننوتل په بریالیتوب سره ترسره شو!';
        
        setTimeout(function() {
            window.location.href = 'admin.html';
        }, 800);
    } else {
        messageBox.className = 'message error';
        messageBox.textContent = '❌ ناسم کارن نوم یا پاسورډ';
        document.getElementById('password').value = '';
    }
    
    return false;
}
</script>

</body>
</html>
