<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9534f">
<title>د پلور پرمختللی راپور</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
body { background: #f0f2f5; padding-bottom: 30px; }
.header { background: #d9534f; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 18px; }
.header a { color: white; text-decoration: none; font-size: 13px; padding: 6px 10px; background: rgba(255,255,255,0.15); border-radius: 8px; }
.container { padding: 15px; }

/* د فلټرونو پینل */
.filter-panel { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.filter-panel h3 { font-size: 14px; color: #333; margin-bottom: 12px; }
.filter-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.filter-group { flex: 1; min-width: 120px; }
.filter-group label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; }
.filter-group select, .filter-group input { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 13px; }

.btn { padding: 12px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
.btn-primary { background: #d9534f; color: white; flex: 1; }
.btn-success { background: #7bbf6a; color: white; flex: 1; }
.btn-blue { background: #3498db; color: white; flex: 1; }
.btn-orange { background: #f39c12; color: white; flex: 1; }

/* د احصایو کارتونه */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
.stat-card { background: white; border-radius: 12px; padding: 15px 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.stat-card .icon { font-size: 24px; margin-bottom: 6px; }
.stat-card .value { font-size: 20px; font-weight: bold; color: #d9534f; line-height: 1; }
.stat-card .label { font-size: 10px; color: #666; margin-top: 4px; }
.stat-card.green .value { color: #7bbf6a; }
.stat-card.blue .value { color: #3498db; }
.stat-card.orange .value { color: #f39c12; }
.stat-card.purple .value { color: #9b59b6; }

/* د ګراف بکس */
.chart-box { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.chart-box h3 { font-size: 14px; color: #333; margin-bottom: 12px; }
.chart-container { position: relative; height: 200px; width: 100%; }

/* د جدول */
.table-box { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; }
.table-box h3 { font-size: 14px; color: #333; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #d9534f; color: white; padding: 10px 8px; text-align: right; font-weight: bold; }
td { padding: 10px 8px; text-align: right; border-bottom: 1px solid #f0f0f0; }
tr:last-child td { border-bottom: none; }
tr:hover { background: #f8f9fa; }
.total-row { background: #f8f9fa; font-weight: bold; }

/* د راپور لیست */
.report-item { background: white; border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-right: 4px solid #d9534f; }
.report-item .info { flex: 1; }
.report-item .name { font-size: 13px; font-weight: bold; color: #333; }
.report-item .meta { font-size: 10px; color: #999; margin-top: 3px; }
.report-item .amount { background: #7bbf6a; color: white; padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }

.empty { text-align: center; padding: 30px; color: #999; font-size: 13px; background: white; border-radius: 12px; }

.nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; box-shadow: 0 -2px 15px rgba(0,0,0,0.08); z-index: 100; }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #999; font-size: 11px; flex: 1; max-width: 80px; }
.nav .icon { font-size: 22px; }
.nav a.active { color: #d9534f; }
</style>
</head>
<body>

<div class="header">
<h1>📊 د پلور پرمختللی راپور        
</h1>
<a href="index.html">← بیر       ته</a>
</div>

<div class=" htmlcontainer">

<!-- د فلټرون +=و پینل -->
<div class="filter-panel">
<h3> '<🔍 فلټرونه</h3>
<div class="filtertr-row">
<div class="filter-group">
<label>د نیټې پیل</label>
<input type="date" id="dateFrom">
</div>
<div class="filter-group">
<label>د نیټې پای</label>
<input type="date" id="dateTo">
</div>
</div>
<div class="filter-row">
<div class="filter-group">
<label>محصول</label>
<select id="filterProduct">
<option value="">ټول محصولات</option>
</select>
</div>
<div class="filter-group">
<label>کټګوري</label>
<select id="filterCategory">
<option value="">ټول کټګورۍ</option>
</select>
</div>
</div>
<div class="filter-row">
<button class="btn btn-primary" onclick="applyFilters()">🔍 راپور جوړ کړه</button>
<button class="btn btn-orange" onclick="resetFilters()">🔄 پاک کړه</button>
</div>
<div class="filter-row">
<button class="btn btn-success" onclick="exportCSV()">📥 CSV صادرول</button>
<button class="btn btn-blue" onclick="exportPDF()">📄 PDF صادرول</button>
</div>
</div>

<!-- د احصایو کارتونه -->
<div class="stats-grid">
<div class="stat-card green">
<div class="icon">💰</div>
<div class="value" id="totalSales">0</div>
<div class="label">ټول پلور (ر.س)</div>
</div>
<div class="stat-card blue">
<div class="icon">📈</div>
<div class="value" id="totalProfit">0</div>
<div class="label">ټوله ګټه (ر.س)</div>
</div>
<div class="stat-card orange">
<div class="icon">📦</div>
<div class="value" id="totalItems">0</div>
<div class="label">ټول پلورل شوي</div>
</div>
<div class="stat-card purple">
<div class="icon">🛒</div>
<div class="value" id="totalTransactions">0</div>
<div class="label">ټول لیږدونه</div>
</div>
</div>

<!-- د ګراف -->
<div class="chart-box">
<h3>📈 د ورځني پلور ګراف</h3>
<div class="chart-container"><canvas id="dailyChart"></canvas></div>
</div>

<!-- د محصولاتو جدول -->
<div class="table-box">
<h3>📊 د محصولاتو پلور</h3>
<div id="productsTable"></div>
</div>

<!-- د کټګوریو جدول -->
<div class="table-box">
<h3>📂 د کټګوریو پلور</h3>
<div id="categoriesTable"></div>
</div>

<!-- د پلور لیست -->
<div class="table-box">
<h3>📋 د پلور لیست</h3>
<div id="salesList"></div>
</div>

</div>

<nav class="nav">
<a href="index.html"><span class="icon">🏠</span><span>کور</span></a>
<a href="dashboard.html"><span class="icon">📊</span><span>ډشبورډ</span></a>
<a href="reports.html" class="active"><span class="icon">📋</span><span>راپور</span></a>
<a href="sales.html"><span class="icon">📈</span><span>پلور</span></a>

</nav>

<script>
var PRODUCTS_KEY = 'dmart_products';
var SALES_KEY = 'dmart_sales';
var VAT_RATE = 0.15;

var allSales = [];
var allProducts = [];
var dailyChartInstance = null;

function loadProducts() {
    var data = localStorage.getItem(PRODUCTS_KEY);
    if (data) { try { return JSON.parse(data); } catch(e) { return []; } }
    return [];
}

function loadSales() {
    var data = localStorage.getItem(SALES_KEY);
    if (data) { try { return JSON.parse(data); } catch(e) { return []; } }
    return [];
}

// ===== د فلټرونو ډکول =====
function fillFilters() {
    var products = loadProducts();
    var sales = loadSales();
    
    // محصولات
    var productSelect = document.getElementById('filterProduct');
    productSelect.innerHTML = '<option value="">ټول محصولات</option>';
    var productNames = {};
    for (var i = 0; i < products.length; i++) {
        if (!productNames[products[i].name]) {
            productNames[products[i].name] = true;
            productSelect.innerHTML += '<option value="' + products[i].name + '">' + products[i].name + '</option>';
        }
    }
    
    // کټګورۍ
    var catSelect = document.getElementById('filterCategory');
    catSelect.innerHTML = '<option value="">ټول کټګورۍ</option>';
    var cats = {};
    for (var i = 0; i < products.length; i++) {
        var cat = products[i].category || 'نامعلوم';
        if (!cats[cat]) {
            cats[cat] = true;
            catSelect.innerHTML += '<option value="' + cat + '">' + cat + '</option>';
        }
    }
}

// ===== د فلټرونو تطبیق =====
function applyFilters() {
    var dateFrom = document.getElementById('dateFrom').value;
    var dateTo = document.getElementById('dateTo').value;
    var filterProduct = document.getElementById('filterProduct').value;
    var filterCategory = document.getElementById('filterCategory').value;
    
    allProducts = loadProducts();
    var sales = loadSales();
    
    var filtered = [];
    for (var i = 0; i < sales.length; i++) {
        var s = sales[i];
        var d = new Date(s.time);
        
        // د نیټې فلټر
        if (dateFrom) {
            var from = new Date(dateFrom + 'T00:00:00');
            if (d < from) continue;
        }
        if (dateTo) {
            var to = new Date(dateTo + 'T23:59:59');
            if (d > to) continue;
        }
        
        // د محصول فلټر
        if (filterProduct && s.name !== filterProduct) continue;
        
        // د کټګوري فلټر
        if (filterCategory) {
            var prod = null;
            for (var j = 0; j < allProducts.length; j++) {
                if (allProducts[j].name === s.name) { prod = allProducts[j]; break; }
            }
            if (!prod || (prod.category || 'نامعلوم') !== filterCategory) continue;
        }
        
        filtered.push(s);
    }
    
    allSales = filtered;
    renderAll();
}

function resetFilters() {
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    document.getElementById('filterProduct').value = '';
    document.getElementById('filterCategory').value = '';
    applyFilters();
}

// ===== د احصایو محاسبه =====
function calculateStats() {
    var totalSales = 0, totalProfit = 0, totalItems = 0;
    
    for (var i = 0; i < allSales.length; i++) {
        totalSales += parseFloat(allSales[i].total) || 0;
        totalProfit += parseFloat(allSales[i].profit) || 0;
        totalItems += allSales[i].qty || 1;
    }
    
    document.getElementById('totalSales').textContent = totalSales.toFixed(2);
    document.getElementById('totalProfit').textContent = totalProfit.toFixed(2);
    document.getElementById('totalItems').textContent = totalItems;
    document.getElementById('totalTransactions').textContent = allSales.length;
    
    return { totalSales: totalSales, totalProfit: totalProfit, totalItems: totalItems };
}

// ===== د محصولاتو جدول =====
function renderProductsTable() {
    var productStats = {};
    
    for (var i = 0; i < allSales.length; i++) {
        var s = allSales[i];
        if (!productStats[s.name]) {
            productStats[s.name] = { qty: 0, sales: 0, profit: 0, cost: 0 };
        }
        productStats[s.name].qty += s.qty || 1;
        productStats[s.name].sales += parseFloat(s.total) || 0;
        productStats[s.name].profit += parseFloat(s.profit) || 0;
        productStats[s.name].cost += parseFloat(s.cost) || 0;
    }
    
    var arr = [];
    for (var name in productStats) {
        arr.push({ name: name, qty: productStats[name].qty, sales: productStats[name].sales, profit: productStats[name].profit, cost: productStats[name].cost });
    }
    arr.sort(function(a, b) { return b.sales - a.sales; });
    
    var container = document.getElementById('productsTable');
    if (arr.length === 0) {
        container.innerHTML = '<div class="empty">📭 هیڅ پلور نشته</div>';
        return;
    }
    
    var html = '<table><thead><tr><th>#</th><th>محصول</th><th>مقدار</th><th>پلور</th><th>ګټه</th><th>د ګټې %</th></tr></thead><tbody>';
    var totalSales = 0, totalProfit = 0;
    
    for (var i = 0; i < arr.length; i++) {
        var p = arr[i];
        var profitPct = p.sales > 0 ? ((p.profit / p.sales) * 100).toFixed(1) : '0';
        totalSales += p.sales;
        totalProfit += p.profit;
>' +
            '<td>' + (i+1) + '</td>' +
            '<td><strong>' + p.name + '</strong></td>' +
            '<td>' + p.qty + '</td>' +
            '<td>' + p.sales.toFixed(2) + ' ر.س</td>' +
            '<td style="color:#27ae60;font-weight:bold;">' + p.profit.toFixed(2) + ' ر.س</td>' +
            '<td style="color:' + (profitPct > 0 ? '#27ae60' : '#e74c3c') + ';">' + profitPct + '٪</td>' +
            '</tr>';
    }
    
    html += '<tr class="total-row"><td colspan="3">ټول</td><td>' + totalSales.toFixed(2) + ' ر.س</td><td>' + totalProfit.toFixed(2) + ' ر.س</td><td>-</td></tr>';
    html += '</tbody></table>';
    container.innerHTML = html;
}

// ===== د کټګوریو جدول =====
function renderCategoriesTable() {
    var catStats = {};
    
    for (var i = 0; i < allSales.length; i++) {
        var s = allSales[i];
        var prod = null;
        for (var j = 0; j < allProducts.length; j++) {
            if (allProducts[j].name === s.name) { prod = allProducts[j]; break; }
        }
        var cat = prod && prod.category ? prod.category : 'نامعلوم';
        
        if (!catStats[cat]) {
            catStats[cat] = { qty: 0, sales: 0, profit: 0 };
        }
        catStats[cat].qty += s.qty || 1;
        catStats[cat].sales += parseFloat(s.total) || 0;
        catStats[cat].profit += parseFloat(s.profit) || 0;
    }
    
    var arr = [];
    for (var cat in catStats) {
        arr.push({ name: cat, qty: catStats[cat].qty, sales: catStats[cat].sales, profit: catStats[cat].profit });
    }
    arr.sort(function(a, b) { return b.sales - a.sales; });
    
    var container = document.getElementById('categoriesTable');
    if (arr.length === 0) {
        container.innerHTML = '<div class="empty">📭 هیڅ کټګوري نشته</div>';
        return;
    }
    
    var html = '<table><thead><tr><th>#</th><th>کټګوري</th><th>مقدار</th><th>پلور</th><th>ګټه</th></tr></thead><tbody>';
    for (var i = 0; i < arr.length; i++) {
        var c = arr[i];
        html += '<tr>' +
            '<td>' + (i+1) + '</td>' +
            '<td><strong>' + c.name + '</strong></td>' +
            '<td>' + c.qty + '</td>' +
            '<td>' + c.sales.toFixed(2) + ' ر.س</td>' +
            '<td style="color:#27ae60;font-weight:bold;">' + c.profit.toFixed(2) + ' ر.س</td>' +
            '</tr>';
    }
    html += '</tbody></table>';
    container.innerHTML = html;
}

// ===== د پلور لیست =====
function renderSalesList() {
    var container = document.getElementById('salesList');
    if (allSales.length === 0) {
        container.innerHTML = '<div class="empty">📭 په دې موده کې هیڅ پلور نشته</div>';
        return;
    }
    
    // د ۵۰ وروستیو پلورونو ښودل
    var recent = allSales.slice(0, 50);
    var html = '';
    
    for (var i = 0; i < recent.length; i++) {
        var s = recent[i];
        var d = new Date(s.time);
        var timeStr = d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear() + ' ' + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
        var profitText = s.profit !== undefined && s.costPrice > 0 ? ' • 📈 ' + parseFloat(s.profit).toFixed(2) + ' ر.س' : '';
        
        html += '<div class="report-item">' +
            '<div class="info">' +
            '<div class="name">' + (s.icon || '📦') + ' ' + s.name + '</div>' +
            '<div class="meta">🕐 ' + timeStr + ' • ' + s.qty + ' × ' + s.price + ' ر.س' + profitText + '</div>' +
            '</div>' +
            '<div class="amount">' + parseFloat(s.total).toFixed(2) + ' ر.س</div>' +
            '</div>';
    }
    container.innerHTML = html;
}

// ===== د ورځني پلور ګراف =====
function drawDailyChart() {
    var dailyData = {};
    
    for (var i = 0; i < allSales.length; i++) {
        var s = allSales[i];
        var d = new Date(s.time);
        var dayStr = d.getDate() + '/' + (d.getMonth()+1);
        if (!dailyData[dayStr]) dailyData[dayStr] = { sales: 0, profit: 0 };
        dailyData[dayStr].sales += parseFloat(s.total) || 0;
        dailyData[dayStr].profit += parseFloat(s.profit) || 0;
    }
    
    var labels = Object.keys(dailyData).sort();
    var salesData = [];
    var profitData = [];
    
    for (var i = 0; i < labels.length; i++) {
        salesData.push(dailyData[labels[i]].sales);
        profitData.push(dailyData[labels[i]].profit);
    }
    
    if (dailyChartInstance) dailyChartInstance.destroy();
    
    if (labels.length === 0) {
        document.getElementById('dailyChart').parentElement.innerHTML = '<div class="empty">📭 هیڅ معلومات نشته</div>';
        return;
    }
    
    var ctx = document.getElementById('dailyChart').getContext('2d');
    dailyChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'پلور (ر.س)',
                    data: salesData,
                    borderColor: '#d9534f',
                    backgroundColor: 'rgba(217, 83, 79, 0.1)',
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true
                },
                {
                    label: 'ګټه (ر.س)',
                    data: profitData,
                    borderColor: '#7bbf6a',
                    backgroundColor: 'rgba(123, 191, 106, 0.1)',
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } },
            scales: { y: { beginAtZero: true } }
        }
    });
}

// ===== د CSV صادرول =====
function exportCSV() {
    if (allSales.length === 0) {
        alert('❌ هیڅ معلومات نشته');
        return;
    }
    
    var csv = '\uFEFF'; // BOM for Excel
    csv += 'نیټه,محصول,مقدار,قیمت,ټوله,ګټه,بارکوډ\n';
    
    for (var i = 0; i < allSales.length; i++) {
        var s = allSales[i];
        var d = new Date(s.time);
        var dateStr = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
        csv += '"' + dateStr + '",';
        csv += '"' + s.name + '",';
        csv += s.qty + ',';
        csv += s.price + ',';
        csv += parseFloat(s.total).toFixed(2) + ',';
        csv += (s.profit || 0) + ',';
        csv += '"' + (s.barcode || '') + '"\n';
    }
    
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'sales-report-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    
    alert('✅ CSV ډاونلوډ شو');
}

// ===== د PDF صادرول =====
function exportPDF() {
    if (allSales.length === 0) {
        alert('❌ هیڅ معلومات نشته');
        return;
    }
    
    var html = '<html dir="rtl"><head><meta charset="UTF-8"><title>د پلور راپور</title>';
    html += '<style>body{font-family:Tahoma;padding:20px;}h1{color:#d9534f;}table{width:100%;border-collapse:collapse;}th{background:#d9534f;color:white;padding:8px;}td{padding:8px;border-bottom:1px solid #ddd;}';
    html += '</style></head><body>';
    html += '<h1>📊 د پلور راپور</h1>';
    html += '<p>نیټه: ' + new Date().toLocaleString('ar-EG') + '</p>';
    html += '<table><tr><th>نیټه</th><th>محصول</th><th>مقدار</th><th>ټوله</th><th>ګټه</th></tr>';
    
    for (var i = 0; i < allSales.length; i++) {
        var s = allSales[i];
        var d = new Date(s.time);
        var dateStr = d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
        html += '<tr><td>' + dateStr + '</td><td>' + s.name + '</td><td>' + s.qty + '</td><td>' + parseFloat(s.total).toFixed(2) + ' ر.س</td><td>' + (s.profit || 0).toFixed(2) + ' ر.س</td></tr>';
    }
    
    html += '</table></body></html>';
    
    var blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'sales-report-' + new Date().toISOString().slice(0,10) + '.html';
    a.click();
    
    alert('✅ راپور ډاونلوډ شو\n\n(کولای شئ د پرنټر سره چاپ کړئ)');
}

// ===== د ټولو ښودل =====
function renderAll() {
    calculateStats();
    renderProductsTable();
    renderCategoriesTable();
    renderSalesList();
    drawDailyChart();
}

// ===== پیل =====
